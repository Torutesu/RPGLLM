name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.33.0"

jobs:
  lint:
    name: lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate
      - run: pnpm lint
      # Formatting is not enforced yet: the existing tree predates the Prettier config
      # (140 files differ). Non-blocking until it is applied package by package —
      # see pipeline/status/build-notes.md "Agent F: lint debt".
      - run: pnpm format:check
        continue-on-error: true

  test:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # No DATABASE_URL / TEST_DATABASE_URL on purpose: `apps/api/vitest.config.ts` gives the run
      # its own database (rpgllm_test_<suffix>), creates and migrates it in the global setup and
      # drops it afterwards — so two jobs on one server cannot truncate each other (docs/testing.md).
      TEST_DB_SUFFIX: ci_${{ github.run_id }}
      TEST_DATABASE_BASE_URL: postgresql://postgres@127.0.0.1:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate
      - run: pnpm -r typecheck
      - name: shared tests (if present)
        run: pnpm --filter @rpgllm/shared --if-present test
      - run: pnpm --filter @rpgllm/llm test
      # The suite creates + migrates + drops its own database; nothing to prepare here.
      - run: pnpm --filter api test

      # The scheduler has to boot, run every job once against a real database, and exit 0.
      - name: worker smoke test
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/rpgllm_worker_${{ github.run_id }}
          JWT_SECRET: ci-secret-not-used-for-anything-real
          LLM_MODE: replay
        run: |
          psql "postgresql://postgres@127.0.0.1:5432/postgres" -c "CREATE DATABASE rpgllm_worker_${{ github.run_id }}"
          pnpm --filter api exec prisma migrate deploy
          pnpm --filter api worker --once
          psql "postgresql://postgres@127.0.0.1:5432/postgres" -c "DROP DATABASE rpgllm_worker_${{ github.run_id }} WITH (FORCE)"

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # As above: the harness owns its database (created before the API webServer starts, dropped in
      # the global teardown). See e2e/scripts/db.mjs and docs/testing.md.
      E2E_DB_SUFFIX: ci_${{ github.run_id }}
      E2E_DATABASE_BASE_URL: postgresql://postgres@127.0.0.1:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate

      # The dev sandbox ships a preinstalled Chromium at /opt/pw-browsers and FORBIDS
      # `playwright install`; CI has no such browser, so it is downloaded here and ONLY here
      # (guarded by `env.CI == 'true'`, which is never set in the sandbox).
      # playwright.config.ts defaults `launchOptions.executablePath` to /opt/pw-browsers/chromium,
      # so CI must also export PW_CHROMIUM_PATH — the next step does that.
      - name: install chromium (CI only)
        if: ${{ env.CI == 'true' }}
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: resolve the CI chromium path
        if: ${{ env.CI == 'true' }}
        run: echo "PW_CHROMIUM_PATH=$(pnpm --filter e2e exec node -e "console.log(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"

      - run: pnpm e2e

      - name: upload the playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
